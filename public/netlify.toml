[build]
  publish = "."
  command = ""

# SPA fallback — only serve index.html for HTML routes, not static files
[[redirects]]
  from = "/*.html"
  to = "/index.html"
  status = 200

[[redirects]]
  from = "/admin/*"
  to = "/index.html"
  status = 200

# Disable caching for JS/HTML so updates are instant
[[headers]]
  for = "/*.html"
  [headers.values]
    Cache-Control = "no-cache"

[[headers]]
  for = "/index.html"
  [headers.values]
    Cache-Control = "no-cache"

# Force browser to reload on JS changes
[[headers]]
  for = "/*.js"
  [headers.values]
    Cache-Control = "no-cache"
    Access-Control-Allow-Origin = "*"

# Allow Firebase SDK cross-origin & fast CDN caching
[[headers]]
  for = "/sekiller/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"
    Access-Control-Allow-Origin = "*"

# Streaming and permanent CDN caching for MP3 soundtracks
[[headers]]
  for = "/*.mp3"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"
    Accept-Ranges = "bytes"
    Access-Control-Allow-Origin = "*"
